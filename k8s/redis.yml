# ──────────────────────────────────────────────
# Redis Deployment + PVC + Service
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netop-redis
  namespace: netop
  labels:
    app.kubernetes.io/name: netop
    app.kubernetes.io/part-of: netop-platform
    app.kubernetes.io/component: redis
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netop
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netop
        app.kubernetes.io/component: redis
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values: ["app", "postgres"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              protocol: TCP
          command:
            - redis-server
            - --maxmemory
            - $(REDIS_MAXMEMORY)
            - --maxmemory-policy
            - $(REDIS_MAXMEMORY_POLICY)
            - --appendonly
            - "$(REDIS_APPENDONLY)"
            - --appendfsync
            - "$(REDIS_APPENDFSYNC)"
          envFrom:
            - configMapRef:
                name: netop-redis-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: netop-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netop-redis-data
  namespace: netop
  labels:
    app.kubernetes.io/name: netop
    app.kubernetes.io/component: redis
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: netop-redis
  namespace: netop
  labels:
    app.kubernetes.io/name: netop
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: netop
    app.kubernetes.io/component: redis
