# ==============================================================================
# NetOP Ingress — nginx class, TLS, netop.djezzy.dz
# ==============================================================================
# Routes:
#   /           → netop-app-svc:3000
#   /ws         → netop-realtime-svc:3003  (WebSocket upgrade)
# ==============================================================================

---
# TLS secret (provision with cert-manager or manual kubectl create secret tls)
apiVersion: v1
kind: Secret
metadata:
  name: netop-tls
  namespace: netop
  labels:
    app: netop
    component: ingress
    tier: edge
type: kubernetes.io/tls
data:
  tls.crt: changeit
  tls.key: changeit

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netop-ingress
  namespace: netop
  labels:
    app: netop
    component: ingress
    tier: edge
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "netop-realtime-svc"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:;";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - netop.djezzy.dz
      secretName: netop-tls
  rules:
    - host: netop.djezzy.dz
      http:
        paths:
          # -----------------------------------------------------------------
          # WebSocket path — must come BEFORE the catch-all /
          # -----------------------------------------------------------------
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: netop-realtime-svc
                port:
                  number: 3003
          # -----------------------------------------------------------------
          # Main application
          # -----------------------------------------------------------------
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netop-app-svc
                port:
                  number: 3000
