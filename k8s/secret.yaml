# ==============================================================================
# NetOP Secret — sensitive values (REPLACE 'changeit' BEFORE PRODUCTION)
# ==============================================================================
# In production, use Sealed Secrets, External Secrets Operator, or
# vault injection. This file is for bootstrapping only.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: netop-secrets
  namespace: netop
  labels:
    app: netop
    component: secrets
    tier: platform
type: Opaque
stringData:
  # --- Database ---
  DATABASE_URL: "postgresql://netop:changeit@postgres-svc.netop.svc.cluster.local:5432/netop?schema=public&pgbouncer=true"
  POSTGRES_PASSWORD: "changeit"

  # --- Auth ---
  NEXTAUTH_SECRET: "changeit"

  # --- Observability ---
  SENTRY_DSN: "changeit"

  # --- SMTP ---
  SMTP_HOST: "changeit"
  SMTP_USER: "changeit"
  SMTP_PASS: "changeit"

  # --- SMS ---
  SMS_API_URL: "changeit"
  SMS_API_KEY: "changeit"
