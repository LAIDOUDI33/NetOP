# ──────────────────────────────────────────────
# NetOP — Kubernetes Secrets Template
# ──────────────────────────────────────────────
# IMPORTANT: Do NOT commit real secrets.
# Use: kubectl create secret generic netop-secrets \
#   --from-literal=postgres-password='...' \
#   --from-literal=nextauth-secret='...' \
#   --from-literal=smtp-password='...' \
#   --from-literal=zai-api-key='...' \
#   --namespace=netop
#
# Or use a sealed-secrets / external-secrets operator.
# ──────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: netop-secrets
  namespace: netop
  labels:
    app.kubernetes.io/name: netop
    app.kubernetes.io/part-of: netop-platform
    component: secrets
type: Opaque
# stringData is used here as a TEMPLATE — replace values before applying
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  NEXTAUTH_URL: "https://netop.example.com"
  NEXTAUTH_SECRET: "CHANGE_ME_RANDOM_SECRET_32_CHARS"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: "netop@example.com"
  SMTP_PASS: "CHANGE_ME"
  SLACK_WEBHOOK_URL: ""
  ZAI_API_KEY: "CHANGE_ME"
  REALTIME_DATABASE_URL: "file:/app/db/realtime.db"
  ETL_CRON: "0 */6 * * *"
