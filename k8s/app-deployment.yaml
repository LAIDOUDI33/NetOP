# ==============================================================================
# NetOP App — Next.js Deployment (3 replicas) + HPA (3-10, CPU 70%)
# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netop-app
  namespace: netop
  labels:
    app: netop
    component: app
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: netop
      component: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0           # zero-downtime deploy
  template:
    metadata:
      labels:
        app: netop
        component: app
        tier: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # -------------------------------------------------------------------
      # Anti-affinity: spread app pods across nodes
      # -------------------------------------------------------------------
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: netop
                    component: app
                topologyKey: kubernetes.io/hostname
      # -------------------------------------------------------------------
      # Security: non-root, read-only FS
      # -------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: netop-app
          image: netop-app:latest       # built from Dockerfile
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: netop-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: netop-config
                  key: LOG_LEVEL
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: netop-config
                  key: TZ
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: netop-config
                  key: NEXTAUTH_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netop-secrets
                  key: DATABASE_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netop-secrets
                  key: NEXTAUTH_SECRET
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: netop-secrets
                  key: SENTRY_DSN
          # ---------------------------------------------------------------
          # Probes
          # ---------------------------------------------------------------
          startupProbe:
            httpGet:
              path: /api/health-check
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12          # up to 60s for cold start
          livenessProbe:
            httpGet:
              path: /api/health-check
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health-check
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # ---------------------------------------------------------------
          # Resources
          # ---------------------------------------------------------------
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: netop-app-hpa
  namespace: netop
  labels:
    app: netop
    component: app
    tier: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: netop-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300    # 5 min cooldown before scale-down
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
