# ──────────────────────────────────────────────
# Realtime (Socket.IO) Service Deployment
# ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netop-realtime
  namespace: netop
  labels:
    app.kubernetes.io/name: netop
    app.kubernetes.io/part-of: netop-platform
    app.kubernetes.io/component: realtime
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: netop
      app.kubernetes.io/component: realtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netop
        app.kubernetes.io/component: realtime
        environment: production
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values: ["realtime"]
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
      containers:
        - name: realtime
          image: ghcr.io/YOUR_ORG/netop-realtime:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3003"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netop-secrets
                  key: REALTIME_DATABASE_URL
            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: netop-secrets
                  key: NEXTAUTH_URL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: netop-realtime
  namespace: netop
  labels:
    app.kubernetes.io/name: netop
    app.kubernetes.io/component: realtime
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3003
      targetPort: 3003
      protocol: TCP
  selector:
    app.kubernetes.io/name: netop
    app.kubernetes.io/component: realtime
