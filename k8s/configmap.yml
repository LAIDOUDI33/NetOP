apiVersion: v1
kind: ConfigMap
metadata:
  name: netop-config
  namespace: netop
  labels:
    app.kubernetes.io/name: netop
    app.kubernetes.io/part-of: netop-platform
    component: config
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "postgresql://netop:$(POSTGRES_PASSWORD)@netop-postgres:5432/netop"
  REDIS_URL: "redis://netop-redis:6379/0"
  REALTIME_SERVICE_URL: "http://netop-realtime:3003"
  ETL_SERVICE_URL: "http://netop-etl:3010"
  NOTIFICATION_SERVICE_URL: "http://netop-notifications:3004"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netop-postgres-config
  namespace: netop
  labels:
    app.kubernetes.io/name: netop
    app.kubernetes.io/part-of: netop-platform
    component: postgres-config
data:
  POSTGRES_USER: "netop"
  POSTGRES_DB: "netop"
  PGDATA: "/var/lib/postgresql/data/pgdata"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netop-redis-config
  namespace: netop
  labels:
    app.kubernetes.io/name: netop
    app.kubernetes.io/part-of: netop-platform
    component: redis-config
data:
  REDIS_MAXMEMORY: "512mb"
  REDIS_MAXMEMORY_POLICY: "allkeys-lru"
  REDIS_APPENDONLY: "yes"
  REDIS_APPENDFSYNC: "everysec"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netop-caddy-config
  namespace: netop
  labels:
    app.kubernetes.io/name: netop
    app.kubernetes.io/part-of: netop-platform
    component: caddy-config
data:
  Caddyfile: |
    {$DOMAIN} {
      encode gzip zstd

      handle /api/health-check {
        reverse_proxy netop-app:3000
      }

      handle_path /realtime* {
        reverse_proxy netop-realtime:3003 {
          header_up X-Forwarded-For {remote_host}
          header_up X-Forwarded-Proto {scheme}
        }
      }

      handle_path /etl* {
        reverse_proxy netop-etl:3010 {
          header_up X-Forwarded-For {remote_host}
          header_up X-Forwarded-Proto {scheme}
        }
      }

      handle {
        reverse_proxy netop-app:3000 {
          header_up X-Forwarded-For {remote_host}
          header_up X-Forwarded-Proto {scheme}
          header_up X-Real-IP {remote_host}
        }
      }
    }
