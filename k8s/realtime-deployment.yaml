# ==============================================================================
# NetOP Realtime Service — Deployment (2 replicas) + HPA (2-5)
# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netop-realtime
  namespace: netop
  labels:
    app: netop
    component: realtime
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netop
      component: realtime
  template:
    metadata:
      labels:
        app: netop
        component: realtime
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: netop
                    component: realtime
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: netop-realtime
          image: netop-realtime:latest
          ports:
            - containerPort: 3003
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: netop-config
                  key: NODE_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: netop-config
                  key: LOG_LEVEL
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: netop-config
                  key: TZ
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netop-secrets
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: "0.5"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: netop-realtime-svc
  namespace: netop
  labels:
    app: netop
    component: realtime
    tier: backend
spec:
  type: ClusterIP
  ports:
    - name: ws
      port: 3003
      targetPort: 3003
      protocol: TCP
  selector:
    app: netop
    component: realtime

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: netop-realtime-hpa
  namespace: netop
  labels:
    app: netop
    component: realtime
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: netop-realtime
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
