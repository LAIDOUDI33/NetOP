# =============================================================================
# DJEZZY NATIONAL SOC PLATFORM - PRODUCTION DOCKER COMPOSE
# =============================================================================
# Phase 11: Complete Open-Source Security Tools Integration
#
# This compose file orchestrates all 15+ security tools for the SOC platform:
# - SIEM: Wazuh + Elasticsearch + Kibana
# - EDR: GRR Rapid Response + Osquery Fleet
# - SOAR: TheHive + Cortex
# - Threat Intel: MISP + OpenCTI
# - NSM: Suricata + Zeek + Arkime
# - Vulnerability: OpenVAS + DefectDojo
# - Event Pipeline: Kafka + Zookeeper + Schema Registry
# - Infrastructure: PostgreSQL + Redis + Kong API Gateway
# - Monitoring: Prometheus + Grafana
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml logs -f soc-platform
#
# Scale Targets (Production):
#   - 50K+ EPS event ingestion
#   - 100Gbps network monitoring
#   - 50B+ events/year retention
#   - 15M+ subscriber capacity
#
# @version 11.1.0
# =============================================================================

version: '3.8'

services:

  # =============================================================================
  # DJEZZY SOC PLATFORM (Main Application)
  # =============================================================================
  soc-platform:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: djezzy-soc-platform
    image: djezzy/soc-platform:11.1.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Load all environment from .env.production.filled
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # SIEM
      - WAZUH_API_URL=http://wazuh-manager:55000
      - WAZUH_USERNAME=${WAZUH_USERNAME}
      - WAZUH_PASSWORD=${WAZUH_PASSWORD}
      - WAZUH_ES_NODES=https://elasticsearch-node-1:9200,https://elasticsearch-node-2:9200
      - WAZUH_ES_USERNAME=${WAZUH_ES_USERNAME}
      - WAZUH_ES_PASSWORD=${WAZUH_ES_PASSWORD}
      # EDR
      - GRR_API_URL=http://grr-server:8000
      - GRR_USERNAME=${GRR_USERNAME}
      - GRR_PASSWORD=${GRR_PASSWORD}
      - OSQUERY_FLEET_API_URL=http://fleet:8080
      - OSQUERY_ENROLLMENT_SECRET=${OSQUERY_ENROLLMENT_SECRET}
      # SOAR
      - THEHIVE_API_URL=http://thehive:9000
      - THEHIVE_API_KEY=${THEHIVE_API_KEY}
      - CORTEX_API_URL=http://cortex:9001
      - CORTEX_API_KEY=${CORTEX_API_KEY}
      # Threat Intel
      - MISP_API_URL=http://misp:80
      - MISP_API_KEY=${MISP_API_KEY}
      - OPENCTI_API_URL=http://opencti:8080
      - OPENCTI_API_KEY=${OPENCTI_API_KEY}
      # NSM
      - SURICATA_API_URL=http://suricata:9340
      - ZEEK_CONTROLLER_URL=http://zeek-controller:5000
      - ARKIME_API_URL=http://arkime:8005
      - ARKIME_API_KEY=${ARKIME_API_KEY}
      # Vulnerability
      - OPENVAS_API_URL=https://openvas:9392
      - OPENVAS_USERNAME=${OPENVAS_USERNAME}
      - OPENVAS_PASSWORD=${OPENVAS_PASSWORD}
      - DEFECTDOJO_API_URL=http://defectdojo:8080
      - DEFECTDOJO_API_KEY=${DEFECTDOJO_API_KEY}
      # Kafka
      - KAFKA_BROKERS=kafka-0:9092,kafka-1:9092,kafka-2:9092
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD}
      # Monitoring
      - PROMETHEUS_ENABLED=true
      - GRAFANA_URL=http://grafana:3000
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-frontend
      - soc-backend
      - soc-monitoring
    depends_on:
      - postgresql
      - redis-master
      - elasticsearch-node-1
      - kafka-0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # =============================================================================
  # DATABASE LAYER (PostgreSQL 16 with PgBouncer)
  # =============================================================================
  postgresql:
    image: postgres:16-alpine
    container_name: djezzy-postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=soc_production
      - POSTGRES_USER=soc_user
      - POSTGRES_PASSWORD=${DATABASE_URL_PASSWORD:-changeme}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./scripts/database:/docker-entrypoint-initdb.d
      - /etc/localtime:/etc/localtime:ro
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c work_mem=64MB
      -c max_connections=500
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_level=replica
      -c max_wal_senders=10
      -c hot_standby=on
    networks:
      - soc-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_user -d soc_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: djezzy-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      - DATABASES_HOST=postgresql
      - DATABASES_PORT=5432
      - DATABASES_USER=soc_user
      - DATABASES_PASSWORD=${DATABASE_URL_PASSWORD:-changeme}
      - DATABASES_DBNAME=soc_production
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_DEFAULT_POOL_SIZE=25
      - PGBOUNCER_MAX_CLIENT_CONN=2000
      - ADMIN_USERS=admin,soc_admin
      - ADMIN_PASSWORDS=${PGBOUNCER_ADMIN_PASSWORD:-adminpass}
    volumes:
      - ./config/pgbouncer:/etc/pgbouncer
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    depends_on:
      - postgresql
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # =============================================================================
  # CACHE LAYER (Redis 7 with Sentinel)
  # =============================================================================
  redis-master:
    image: redis:7-alpine
    container_name: djezzy-redis-master
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_master_data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  redis-replica:
    image: redis:7-alpine
    container_name: djezzy-redis-replica
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: >
      redis-server
      --appendonly yes
      --slaveof redis-master 6379
      --masterauth ${REDIS_PASSWORD:-changeme}
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_replica_data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    depends_on:
      - redis-master
    deploy:
      replicas: 2

  # =============================================================================
  # SIEM STACK (Wazuh + Elasticsearch + Kibana)
  # =============================================================================
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.0
    container_name: djezzy-wazuh-manager
    restart: unless-stopped
    ports:
      - "55000:55000"  # API
      - "1514:1514"    # Events
      - "1515:1515"    # Syslog
    environment:
      - INDEXER_URL=https://elasticsearch-node-1:9200
      - INDEXER_USERNAME=${WAZUH_ES_USERNAME:-wazuh}
      - INDEXER_PASSWORD=${WAZUH_ES_PASSWORD:-changeme}
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      - API_USERNAME=${WAZUH_USERNAME:-soc_integration}
      - API_PASSWORD=${WAZUH_PASSWORD:-changeme}
      - NETWORK_TLS=no
    volumes:
      - wazuh_manager_data:/var/ossec/data
      - ./config/wazuh:/var/ossec/etc/custom_config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    depends_on:
      - elasticsearch-node-1
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

  elasticsearch-node-1:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: djezzy-elasticsearch-1
    restart: unless-stopped
    environment:
      - node.name=es-node-1
      - cluster.name=djezzy-soc-cluster
      - discovery.seed_hosts=elasticsearch-node-2,elasticsearch-node-3
      - cluster.initial_master_nodes=es-node-1,es-node-2,es-node-3
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_node_1_data:/usr/share/elasticsearch/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G

  elasticsearch-node-2:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: djezzy-elasticsearch-2
    restart: unless-stopped
    environment:
      - node.name=es-node-2
      - cluster.name=djezzy-soc-cluster
      - discovery.seed_hosts=elasticsearch-node-1,elasticsearch-node-3
      - cluster.initial_master_nodes=es-node-1,es-node-2,es-node-3
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_node_2_data:/usr/share/elasticsearch/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    depends_on:
      - elasticsearch-node-1
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: djezzy-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch-node-1:9200,https://elasticsearch-node-2:9200
      - ELASTICSEARCH_USERNAME=${WAZUH_ES_USERNAME:-wazuh}
      - ELASTICSEARCH_PASSWORD=${WAZUH_ES_PASSWORD:-changeme}
      - XPACK_SECURITY_ENABLED=true
      - XPACK_ENCRYPTEDSAVEDOBJECTS_KEYS=[]
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-min32chars}
    volumes:
      - kibana_data:/usr/share/kibana/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-frontend
      - soc-backend
    depends_on:
      - elasticsearch-node-1
      - elasticsearch-node-2
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # =============================================================================
  # EDR STACK (GRR + Osquery Fleet)
  # =============================================================================
  grr-server:
    image: grr/grr:latest
    container_name: djezzy-grr-server
    restart: unless-stopped
    ports:
      - "8000:8000"  # GRR Admin UI
      - "8080:8080"  # GRR API
    environment:
      - GRR_ADMIN_USERNAME=${GRR_USERNAME:-admin}
      - GRR_ADMIN_PASSWORD=${GRR_ADMIN_PASSWORD:-changeme}
    volumes:
      - grr_server_data:/var/grr
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  fleet:
    image: fleetdm/fleet:latest
    container_name: djezzy-fleet
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - FLEET_DATABASE_DRIVER=postgres
      - FLEET_POSTGRES_ADDR=postgresql:5432
      - FLEET_POSTGRES_DATABASE=fleet
      - FLEET_POSTGRES_USER=soc_user
      - FLENT_POSTGRES_PASSWORD=${DATABASE_URL_PASSWORD:-changeme}
      - FLEET_REDIS_ADDRESS=redis-master:6379
      - FLEET_SERVER_CERT=/etc/fleet/server.cert
      - FLEET_SERVER_KEY=/etc/fleet/server.key
      - FLEET_OSQUERY_SERVICE_UNIX_SOCKET=/var/run/osquery.sock
      - FLEET_ENROLL_SECRET=${OSQUERY_ENROLLMENT_SECRET:-changeme}
    volumes:
      - fleet_data:/var/lib/fleet
      - ./config/fleet/certs:/etc/fleet
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    depends_on:
      - postgresql
      - redis-master
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # =============================================================================
  # SOAR STACK (TheHive + Cortex)
  # =============================================================================
  thehive:
    image: thehiveproject/thehive:5.1
    container_name: djezzy-thehive
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - JVM_OPTS=-Xmx4g
    volumes:
      - thehive_data:/opt/thehive/data
      - ./config/thehive:/opt/thehive/conf
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    depends_on:
      - elasticsearch-node-1
      - cortex
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G

  cortex:
    image: thehiveproject/cortex:3.1
    container_name: djezzy-cortex
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      - JOB_DIRECTORY=/var/cortex/jobs
      - CORTEX_CONFIGURATION_PATH=/etc/cortex/application.conf
    volumes:
      - cortex_data:/var/cortex/data
      - cortex_jobs:/var/cortex/jobs
      - ./config/cortex:/etc/cortex
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    depends_on:
      - elasticsearch-node-1
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G

  # =============================================================================
  # THREAT INTELLIGENCE (MISP + OpenCTI)
  # =============================================================================
  misp:
    image: misp/misp:2.4
    container_name: djezzy-misp
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MYSQL_HOST=mariadb-misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MISP_MYSQL_PASSWORD:-changeme}
      - MYSQL_DATABASE=misp
      - BASE_URL=https://misp.djezzy.dz
      - MISP_ADMIN_EMAIL=admin@djezzy.dz
      - MISP_ADMIN_PASSPHRASE=${MISP_ADMIN_PASSPHRASE:-changeme}
      - MISP_API_KEY=${MISP_API_KEY:-changeme}
      - POSTFIX_RELAY_HOST=${SMTP_HOST:-mailrelay.djezzy.corp}
    volumes:
      - misp_data:/var/www/html/MISP/app/files
      - misp_logs:/var/www/html/MISP/app/tmp/logs
      - ./config/misp:/var/www/html/MISP/app/Config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
      - soc-frontend
    depends_on:
      - mariadb-misp
      - redis-misp
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

  mariadb-misp:
    image: mariadb:10.11
    container_name: djezzy-mariadb-misp
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MISP_MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MISP_MYSQL_PASSWORD:-changeme}
      - MYSQL_DATABASE=misp
    volumes:
      - mariadb_misp_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  redis-misp:
    image: redis:7-alpine
    container_name: djezzy-redis-misp
    restart: unless-stopped
    volumes:
      - redis_misp_data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  opencti:
    image: opencti/opencti:5.12
    container_name: djezzy-opencti
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP__ADMIN__EMAIL=admin@djezzy.dz
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD:-changeme}
      - APP__ADMIN__TOKEN=${OPENCTI_API_KEY:-changeme}
      - CONNECTORS__LIVE__EXPORT_ID_AUTO=true
      - Redis__host=redis-opencti
      - Elasticsearch__url=http://elasticsearch-node-1:9200
      - Elasticsearch__username=${WAZUH_ES_USERNAME:-wazuh}
      - Elasticsearch__password=${WAZUH_ES_PASSWORD:-changeme}
    volumes:
      - opencti_data:/data/opencti
      - ./config/opencti:/opencti/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
      - soc-frontend
    depends_on:
      - elasticsearch-node-1
      - redis-opencti
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G

  redis-opencti:
    image: redis:7-alpine
    container_name: djezzy-redis-opencti
    restart: unless-stopped
    volumes:
      - redis_opencti_data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # =============================================================================
  # NSM STACK (Suricata + Zeek + Arkime)
  # =============================================================================
  suricata:
    image: jasonish/suricata:latest
    container_name: djezzy-suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_RAW
    volumes:
      - suricata_logs:/var/log/suricata
      - suricata_rules:/etc/suricata/rules
      - ./config/suricata:/etc/suricata
      - /etc/localtime:/etc/localtime:ro
    command: >
      suricata
      -i eth0
      --set classification-file=/etc/suricata/rules/classification.config
      - --set reference-config.file=/etc/suricata/rules/reference.config
      - --set rules-file=/etc/suricata/rules/suricata.rules
      - --set eve-log.outputs.1=file.enabled=yes
      - --set eve-log.outputs.1.file.filename=/var/log/suricata/eve.json
      - --set eve-log.outputs.1.file.type=regular
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G

  zeek-controller:
    image: zeek/zeek:latest
    container_name: djezzy-zeek-controller
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - zeek_logs:/usr/local/var/log/zeek
      - zeek_scripts:/usr/local/share/zeek/site
      - ./config/zeek:/opt/zeek/etc
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

  arkime:
    image: arkime/arkime:4.0
    container_name: djezzy-arkime
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - ARKIME_ELASTICSEARCH=https://elasticsearch-node-1:9200
      - ARKIME_ELASTICSEARCH_USER=${WAZUH_ES_USERNAME:-wazuh}
      - ARKIME_ELASTICSEARCH_PASSWORD=${WAZUH_ES_PASSWORD:-changeme}
      - ARKIME_PASSWORD=${ARKIME_API_KEY:-changeme}
    volumes:
      - arkime_pcaps:/opt/arkime/pcap
      - arkime_logs:/opt/arkime/logs
      - ./config/arkime:/opt/arkime/etc
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    cap_add:
      - NET_ADMIN
    depends_on:
      - elasticsearch-node-1
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G

  # =============================================================================
  # VULNERABILITY MANAGEMENT (OpenVAS + DefectDojo)
  # =============================================================================
  openvas:
    image: greenbone/gvm:21.04
    container_name: djezzy-openvas
    restart: unless-stopped
    ports:
      - "9392:9392"
      - "8081:80"    # GSAD Web UI
    environment:
      - GVMD_USER=${OPENVAS_USERNAME:-soc_scanner}
      - GVMD_PASSWORD=${OPENVAS_PASSWORD:-changeme}
      - POSTGRES_HOST=openvas-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=gvm
      - POSTGRES_PASSWORD=${OPENVAS_PG_PASSWORD:-changeme}
      - POSTGRES_DBNAME=gvm
      - REDIS_HOST=redis-openvas
      - REDIS_PORT=6379
      - SMTP_HOST=${SMTP_HOST:-mailrelay.djezzy.corp}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_FROM_ADDR=noreply-openvas@djezzy.dz
    volumes:
      - openvas_data:/var/lib/gvm
      - openvas_logs:/var/log/gvm
      - ./config/openvas:/usr/local/etc/openvas
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
      - soc-frontend
    depends_on:
      - openvas-postgres
      - redis-openvas
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  openvas-postgres:
    image: postgres:14-alpine
    container_name: djezzy-openvas-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=gvm
      - POSTGRES_USER=gvm
      - POSTGRES_PASSWORD=${OPENVAS_PG_PASSWORD:-changeme}
    volumes:
      - openvas_pg_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  redis-openvas:
    image: redis:7-alpine
    container_name: djezzy-redis-openvas
    restart: unless-stopped
    volumes:
      - redis_openvas_data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  defectdojo:
    image: defectdojo/defectdojo:2.30
    container_name: djezzy-defectdojo
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DD_DATABASE_URL=postgres://dduser:${DEFECTDOJO_PG_PASSWORD:-changeme}@defectdojo-db:5432/defectdojo
      - DD_SECRET_KEY=${DEFECTDOJOJO_SECRET_KEY:-min32chars}
      - DD_CELERY_BROKER_URL=redis://redis-defectdojo:6379/0
      - DD_CELERY_RESULT_BACKEND=redis://redis-defectdojo:6379/1
    volumes:
      - defectdojo_data:/app/media
      - ./config/defectdojo:/app/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
      - soc-frontend
    depends_on:
      - defectdojo-db
      - redis-defectdojo
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  defectdojo-db:
    image: postgres:14-alpine
    container_name: djezzy-defectdojo-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=defectdojo
      - POSTGRES_USER=dduser
      - POSTGRES_PASSWORD=${DEFECTDOJO_PG_PASSWORD:-changeme}
    volumes:
      - defectdojo_pg_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  redis-defectdojo:
    image: redis:7-alpine
    container_name: djezzy-redis-defectdojo
    restart: unless-stopped
    volumes:
      - redis_defectdojo_data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # =============================================================================
  # EVENT PIPELINE (Apache Kafka Cluster)
  # =============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: djezzy-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-events
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  kafka-0:
    image: confluentinc/cp-kafka:7.5.0
    container_name: djezzy-kafka-0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=0
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-0:9092
      - KAFKA_NUM_PARTITIONS=36
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_LOG_RETENTION_HOURS=168
      - KAFKA_LOG_SEGMENT_BYTES=1073741824
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=300000
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_JVM_PERFORMANCE_OPTS=-Xms4g -Xmx4g -XX:MetaspaceSize=96m
      - KAFKA_HEAP_OPTS=-Xms4g -Xmx4g
    volumes:
      - kafka_0_data:/var/lib/kafka/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-events
    depends_on:
      - zookeeper
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: djezzy-kafka-1
    restart: unless-stopped
    ports:
      - "9093:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-1:9093
      - KAFKA_NUM_PARTITIONS=36
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_JVM_PERFORMANCE_OPTS=-Xms4g -Xmx4g -XX:MetaspaceSize=96m
      - KAFKA_HEAP_OPTS=-Xms4g -Xmx4g
    volumes:
      - kafka_1_data:/var/lib/kafka/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-events
    depends_on:
      - zookeeper
      - kafka-0
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: djezzy-kafka-2
    restart: unless-stopped
    ports:
      - "9094:9092"
    environment:
      - KAFKA_BROKER_ID=2
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-2:9094
      - KAFKA_NUM_PARTITIONS=36
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_JVM_PERFORMANCE_OPTS=-Xms4g -Xmx4g -XX:MetaspaceSize=96m
      - KAFKA_HEAP_OPTS=-Xms4g -Xmx4g
    volumes:
      - kafka_2_data:/var/lib/kafka/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-events
    depends_on:
      - zookeeper
      - kafka-0
      - kafka-1
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: djezzy-schema-registry
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=kafka-0:9092,kafka-1:9093,kafka-2:9094
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
      - SCHEMA_REGISTRY_AVRO_COMPATIBILITY_LEVEL=backward
      - SCHEMA_REGISTRY_INTER_INSTANCE_PROTOCOL=http
      - SCHEMA_REGISTRY_LOG4J_ROOT_LOG_LEVEL=WARN
    networks:
      - soc-events
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # =============================================================================
  # API GATEWAY (Kong)
  # =============================================================================
  kong-database:
    image: postgres:14-alpine
    container_name: djezzy-kong-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=kong
      - POSTGRES_USER=kong
      - POSTGRES_PASSWORD=${KONG_PG_PASSWORD:-kongpassword}
    volumes:
      - kong_db_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  kong-migration:
    image: kong:3.4
    container_name: djezzy-kong-migration
    restart: on-failure
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=kong-database
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=${KONG_PG_PASSWORD:-kongpassword}
      - KONG_CASSANDRA_CONTACT_POINTS=kong-database
    networks:
      - soc-backend
    depends_on:
      - kong-database
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  kong:
    image: kong:3.4
    container_name: djezzy-kong-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"   # Proxy
      - "8443:8443"   # Proxy SSL
      - "8001:8001"   # Admin API
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=kong-database
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=${KONG_PG_PASSWORD:-kongpassword}
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_ADMIN_GUI_URL=http://localhost:8002
    networks:
      - soc-frontend
      - soc-backend
    depends_on:
      - kong-database
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # =============================================================================
  # MONITORING (Prometheus + Grafana)
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: djezzy-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
      - /etc/localtime:/etc/localtime:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - soc-monitoring
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  grafana:
    image: grafana/grafana:10.1.0
    container_name: djezzy-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-frontend
      - soc-monitoring
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # =============================================================================
  # LOG AGGREGATION (Fluentd/Loki)
  # =============================================================================
  loki:
    image: grafana/loki:2.8.0
    container_name: djezzy-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./config/loki:/etc/loki
      - /etc/localtime:/etc/localtime:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - soc-monitoring
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  fluentd:
    image: fluent/fluentd:v1.15
    container_name: djezzy-fluentd
    restart: unless-stopped
    volumes:
      - ./config/fluentd:/fluentd/etc
      - /var/log:/var/log:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - soc-backend
      - soc-monitoring
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  soc-frontend:
    name: soc-frontend
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  
  soc-backend:
    name: soc-backend
    driver: bridge
    internal: true  # No external access to backend services
    ipam:
      config:
        - subnet: 172.29.0.0/16
  
  soc-events:
    name: soc-events
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
  
  soc-monitoring:
    name: soc-monitoring
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  # Database Volumes
  postgresql_data:
    driver: local
  es_node_1_data:
    driver: local
  es_node_2_data:
    driver: local
  kibana_data:
    driver: local
  
  # Cache Volumes
  redis_master_data:
    driver: local
  redis_replica_data:
    driver: local
  
  # SIEM Volumes
  wazuh_manager_data:
    driver: local
  
  # EDR Volumes
  grr_server_data:
    driver: local
  fleet_data:
    driver: local
  
  # SOAR Volumes
  thehive_data:
    driver: local
  cortex_data:
    driver: local
  cortex_jobs:
    driver: local
  
  # Threat Intel Volumes
  misp_data:
    driver: local
  misp_logs:
    driver: local
  mariadb_misp_data:
    driver: local
  redis_misp_data:
    driver: local
  opencti_data:
    driver: local
  redis_opencti_data:
    driver: local
  
  # NSM Volumes
  suricata_logs:
    driver: local
  suricata_rules:
    driver: local
  zeek_logs:
    driver: local
  zeek_scripts:
    driver: local
  arkime_pcaps:
    driver: local
  arkime_logs:
    driver: local
  
  # Vulnerability Volumes
  openvas_data:
    driver: local
  openvas_logs:
    driver: local
  openvas_pg_data:
    driver: local
  redis_openvas_data:
    driver: local
  defectdojo_data:
    driver: local
  defectdojo_pg_data:
    driver: local
  redis_defectdojo_data:
    driver: local
  
  # Event Pipeline Volumes
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_0_data:
    driver: local
  kafka_1_data:
    driver: local
  kafka_2_data:
    driver: local
  
  # Gateway Volumes
  kong_db_data:
    driver: local
  
  # Monitoring Volumes
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
