version: "3.9"

services:
  netoptima:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "run", "dev"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/netoptima.db
      - NEXTAUTH_SECRET=dev-secret-do-not-use-in-prod
      - NEXTAUTH_URL=http://localhost:3000
      - LOG_LEVEL=debug
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - netoptima-dev-data:/app/data

volumes:
  netoptima-dev-data:
