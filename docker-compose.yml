# ──────────────────────────────────────────────
# NetOptima Algérie — Docker Compose
# ──────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netoptima-algerie
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/db          # persist SQLite database
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/db/custom.db
      - NEXTAUTH_URL=http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health-check"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 512m
    cpus: 1.0

volumes:
  db-data:
    driver: local
