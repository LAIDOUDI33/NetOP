name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.2.13'
  NODE_VERSION: '22'

jobs:
  # ── Lint ──────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint

  # ── Type Check ────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  # ── Prisma Schema Validation ──────────────────────
  prisma-validate:
    name: Prisma Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bunx prisma validate
      - run: bunx prisma format --check
      - name: Check generated client is up-to-date
        run: |
          bunx prisma generate
          if ! git diff --exit-code prisma/generated; then
            echo "❌ Prisma client is out of date. Run 'bunx prisma generate' and commit."
            exit 1
          fi

  # ── Unit Tests ────────────────────────────────────
  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bunx vitest run --reporter=verbose
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Production Build ──────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, prisma-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            .next/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}-next-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}-next-
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Build Next.js
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          AUTH_ENFORCED: 'false'
          DATABASE_URL: 'file:./dev.db'
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3

  # ── Security Scan ─────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - name: Audit npm dependencies
        run: bunx audit-ci --moderate
        continue-on-error: true
      - name: Check for .env files in repo
        run: |
          if find . -name '.env' -not -name '.env.example' | grep -q .; then
            echo "❌ Found .env file(s) in repository. Remove them before committing."
            find . -name '.env' -not -name '.env.example'
            exit 1
          fi
      - name: Check for hardcoded secrets
        run: |
          PATTERNS='NEXTAUTH_SECRET|JWT_SECRET|DATABASE_URL.*sqlite.*prod|password.*=.*[^*]'
          MATCHES=$(rg -l "$PATTERNS" src/ prisma/ --glob '!*.example' 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "⚠️  Potential hardcoded secrets found:"
            echo "$MATCHES"
            echo "Review these files and ensure secrets are in .env only."
          fi
